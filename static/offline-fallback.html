<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IAS Machine — Offline</title>
<style>
body{font-family:Georgia,serif;background:#0d1117;color:#e6edf3;display:flex;
     flex-direction:column;align-items:center;justify-content:center;min-height:100vh;
     margin:0;padding:20px;text-align:center;}
.icon{font-size:64px;margin-bottom:16px;}
h1{margin:0 0 12px;font-size:22px;letter-spacing:1px;color:#d4a017;}
p{color:#8b949e;font-size:14px;line-height:1.6;max-width:400px;margin:8px 0;}
a.btn{display:inline-block;margin-top:20px;padding:14px 26px;
      background:linear-gradient(135deg,#d4a017,#b8860b);color:#0d1117;
      text-decoration:none;border-radius:12px;font-weight:700;font-size:15px;
      box-shadow:0 4px 14px rgba(0,0,0,0.3);}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px;}
a.sec{display:inline-block;padding:12px 20px;background:#21262d;color:#e6edf3;
      text-decoration:none;border-radius:12px;font-weight:600;font-size:14px;
      border:1px solid #30363d;}
.cached{margin-top:24px;font-size:12px;color:#8b949e;max-width:400px;}
</style>
</head>
<body>
<div class="icon">📡</div>
<h1>You're Offline</h1>
<p>No internet, but your saved pages still work.</p>
<div class="btn-row">
  <a class="btn" href="/">🏠 Home</a>
  <a class="sec" href="/toolkit">🧰 Toolkit</a>
  <a class="sec" href="/library">📚 Library</a>
</div>
<div class="cached" id="cachedInfo">Checking saved content…</div>
<script>
navigator.storage && navigator.storage.estimate && navigator.storage.estimate().then(e => {
  const used = (e.usage/1024/1024).toFixed(1);
  const quota = (e.quota/1024/1024/1024).toFixed(1);
  document.getElementById('cachedInfo').textContent =
    `📦 ${used} MB cached · ${quota} GB available`;
});
</script>
</body>
</html>
