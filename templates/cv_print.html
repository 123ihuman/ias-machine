<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>{{ cv.name }} — CV</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Lora:wght@400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
@page{size:A4;margin:12mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Lora',serif;font-size:11.5px;color:#111;background:#f5f1e8;padding:20px}
.bar{background:#1a3a6b;color:#fff;padding:10px;text-align:center;margin-bottom:16px;font-family:'Oswald',sans-serif}
.bar button{background:#fff;color:#1a3a6b;border:none;padding:8px 20px;font-family:'Oswald',sans-serif;font-weight:700;cursor:pointer;border-radius:4px;margin-left:8px}
@media print{.bar{display:none}body{background:#fff;padding:0}}
</style>
</head>
<body>
<div class="bar">🖨️ Save as PDF — Print<button onclick="window.print()">PRINT / SAVE PDF</button><button onclick="window.close()">Close</button></div>
{% include '_cv_layout.html' %}
</body>
</html>
